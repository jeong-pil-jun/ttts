<title>구구단 칠판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: 상단 단 선택 칩 + 2~9단 카드 그리드(4→2→1열) + 아래 짧은 퀴즈 */
  :root {
    --bg: #eef3ef;
    --surface: #ffffff;
    --ink: #1d2b24;
    --muted: #5d6f66;
    --line: #d3ddd6;
    --accent: #2f7a55;
    --accent-soft: #dcefe4;
    --chalk: #c2563a;
    --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
    --font-body: "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17211c; --surface: #1f2c25; --ink: #e8f0ea; --muted: #9bb0a4;
      --line: #2f4037; --accent: #6fcf9b; --accent-soft: #24402f; --chalk: #f0a080;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17211c; --surface: #1f2c25; --ink: #e8f0ea; --muted: #9bb0a4;
    --line: #2f4037; --accent: #6fcf9b; --accent-soft: #24402f; --chalk: #f0a080;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  header { display: flex; flex-direction: column; gap: 4px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 2.4rem;
    margin: 0;
    color: var(--accent);
    text-wrap: balance;
  }
  header p { margin: 0; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 500 0.95rem var(--font-body);
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip:focus-visible, .card:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--chalk); outline-offset: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s, background .15s;
  }
  .card.on { border-color: var(--accent); background: var(--accent-soft); }
  .card h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.5rem;
    color: var(--accent);
  }
  .card ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .card li {
    display: grid;
    grid-template-columns: 1fr auto;
    padding: 2px 6px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .card li:hover { background: var(--accent-soft); }
  .card li b { font-weight: 700; color: var(--ink); }
  .card li span { color: var(--muted); }

  .quiz {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  .quiz h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; width: 100%; }
  .q { font-family: var(--font-display); font-size: 2rem; font-variant-numeric: tabular-nums; }
  .quiz input {
    width: 6ch;
    font: 700 1.4rem var(--font-body);
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    text-align: center;
  }
  .quiz button {
    font: 500 0.95rem var(--font-body);
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
  }
  .quiz button.ghost { background: transparent; color: var(--accent); }
  .msg { min-height: 1.5em; font-weight: 500; }
  .msg.ok { color: var(--accent); }
  .msg.no { color: var(--chalk); }
  .score { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>구구단 GOGO</h1>
    <h1>구구단 GOGO111</h1>
    <p>2단부터 9단까지. 단을 누르면 해당 표가 강조됩니다.</p>
  </header>

  <div class="chips" id="chips" role="group" aria-label="단 선택"></div>

  <div class="grid" id="grid"></div>

  <section class="quiz" aria-labelledby="quiz-title">
    <h2 id="quiz-title">문제 풀기</h2>
    <span class="q" id="question">7 × 8 =</span>
    <input id="answer" type="number" inputmode="numeric" aria-label="정답 입력">
    <button id="check" type="button">확인</button>
    <button id="next" type="button" class="ghost">다음 문제</button>
    <span class="score" id="score">맞힌 문제 0 / 0</span>
    <div class="msg" id="msg" aria-live="polite" style="width:100%"></div>
  </section>
</div>

<script>
  const chips = document.getElementById('chips');
  const grid = document.getElementById('grid');
  let selected = 0; // 0 = 전체

  const allChip = document.createElement('button');
  allChip.className = 'chip';
  allChip.textContent = '전체';
  allChip.dataset.dan = '0';
  chips.appendChild(allChip);

  for (let d = 2; d <= 9; d++) {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = d + '단';
    c.dataset.dan = String(d);
    chips.appendChild(c);

    const card = document.createElement('article');
    card.className = 'card';
    card.id = 'dan-' + d;
    let rows = '';
    for (let i = 1; i <= 9; i++) {
      rows += `<li><span>${d} × ${i}</span><b>${d * i}</b></li>`;
    }
    card.innerHTML = `<h2>${d}단</h2><ol>${rows}</ol>`;
    grid.appendChild(card);
  }

  function select(dan) {
    selected = dan;
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.dan) === dan)));
    grid.querySelectorAll('.card').forEach(card => card.classList.toggle('on', card.id === 'dan-' + dan));
    if (dan) document.getElementById('dan-' + dan).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    newQuestion();
  }
  chips.addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (c) select(Number(c.dataset.dan));
  });

  // 퀴즈: 단을 고르면 그 단에서만 출제
  const qEl = document.getElementById('question');
  const ans = document.getElementById('answer');
  const msg = document.getElementById('msg');
  const scoreEl = document.getElementById('score');
  let a = 7, b = 8, right = 0, total = 0, answered = false;

  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function newQuestion() {
    a = selected || rand(2, 9);
    b = rand(1, 9);
    qEl.textContent = `${a} × ${b} =`;
    ans.value = '';
    msg.textContent = '';
    msg.className = 'msg';
    answered = false;
  }
  function check() {
    if (ans.value === '') { msg.textContent = '숫자를 입력하세요.'; msg.className = 'msg no'; return; }
    const ok = Number(ans.value) === a * b;
    if (!answered) { total++; if (ok) right++; answered = true; }
    scoreEl.textContent = `맞힌 문제 ${right} / ${total}`;
    msg.textContent = ok ? `정답! ${a} × ${b} = ${a * b}` : `아쉬워요. ${a} × ${b} = ${a * b}`;
    msg.className = 'msg ' + (ok ? 'ok' : 'no');
  }
  document.getElementById('check').addEventListener('click', check);
  document.getElementById('next').addEventListener('click', () => { newQuestion(); ans.focus(); });
  ans.addEventListener('keydown', e => {
    if (e.key === 'Enter') { answered ? newQuestion() : check(); }
  });

  select(0);
  qEl.textContent = '7 × 8 =';
  a = 7; b = 8;
</script>
